<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #09090b;
            --card: rgba(30, 30, 35, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6; /* Фиолетовый неон */
            --accent-glow: rgba(139, 92, 246, 0.3);
            --text: #ffffff;
            --sub: #a1a1aa;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; padding-bottom: 90px;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        
        /* Анимированный фон */
        .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: float 10s infinite alternate; }
        .blob-1 { width: 300px; height: 300px; background: var(--accent); top: -100px; left: -100px; }
        .blob-2 { width: 200px; height: 200px; background: #00ffcc; bottom: 100px; right: -50px; }
        @keyframes float { 0% { transform: translate(0,0); } 100% { transform: translate(30px, 50px); } }

        /* Экраны */
        .screen { display: none; padding: 20px; animation: slideUp 0.3s ease; }
        .screen.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Карточки */
        .glass-card {
            background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Профиль (Главная) */
        .avatar { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #00ffcc); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; box-shadow: 0 0 20px var(--accent-glow); }
        .balance { font-size: 42px; font-weight: 900; letter-spacing: -1px; margin: 10px 0; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .rank { display: inline-block; background: rgba(139, 92, 246, 0.2); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        /* Меню действий */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .menu-btn { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
        .menu-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.05); }
        .menu-btn span { font-size: 28px; }
        .menu-btn b { font-size: 14px; }

        /* Магазин */
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card); border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--border); }
        .btn { background: var(--accent); color: #fff; border: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px var(--accent-glow); }
        .btn:active { transform: scale(0.95); }
        
        /* Казино Апгрейдер */
        .upg-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; padding: 15px; border-radius: 12px; font-size: 18px; text-align: center; margin-bottom: 15px; font-weight: bold; }
        .upg-mults { display: flex; gap: 10px; margin-bottom: 15px; }
        .upg-mult { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .upg-mult:active { background: var(--accent); }
        .upg-result { text-align: center; font-size: 20px; font-weight: bold; min-height: 30px; margin-top: 15px; }

        /* Нижнее меню */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 25px 0; z-index: 100; }
        .nav-item { background: none; border: none; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .nav-item span { font-size: 24px; }
        .nav-item.active { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
        .nav-item.active span { transform: translateY(-2px); }

        h2 { margin: 0 0 20px 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .loader { text-align: center; padding: 50px; color: var(--sub); font-weight: bold; }
    </style>
</head>
<body>

    <div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="tab-home" class="screen active">
        <div class="glass-card" style="text-align: center;">
            <div class="avatar" id="avatar">?</div>
            <h2 id="nickname" style="margin: 10px 0 5px 0; font-size: 24px;">Загрузка...</h2>
            <div class="rank" id="rank">Место: #--</div>
            <div class="balance" id="balance">0 💰</div>
        </div>

        <div class="grid-menu">
            <div class="menu-btn" onclick="claimDaily()">
                <span>🎁</span><b>Дейлики</b>
            </div>
            <div class="menu-btn" onclick="switchTab('shop', document.querySelectorAll('.nav-item')[1])">
                <span>🛒</span><b>Магазин</b>
            </div>
            <div class="menu-btn" onclick="tg.showAlert('Банды скоро!')">
                <span>🏴</span><b>Банда</b>
            </div>
            <div class="menu-btn" onclick="tg.showAlert('Инвентарь скоро!')">
                <span>🎒</span><b>Инвентарь</b>
            </div>
        </div>
        
        <div class="glass-card" style="margin-top: 20px;">
            <h3 style="margin: 0 0 10px 0; font-size: 16px;">📰 События</h3>
            <p style="color: var(--sub); font-size: 14px; margin: 0;">Игрок X выиграл джекпот!</p>
        </div>
    </div>

    <!-- ЭКРАН 2: МАГАЗИН -->
    <div id="tab-shop" class="screen">
        <h2>🛒 Магазин</h2>
        <div id="shop-list" class="loader">Загрузка товаров...</div>
    </div>

    <!-- ЭКРАН 3: КАЗИНО -->
    <div id="tab-casino" class="screen">
        <h2>🎰 Казино</h2>
        <div class="glass-card">
            <h3 style="margin: 0 0 15px 0; color: var(--accent);">📈 Апгрейдер</h3>
            <input type="number" id="upg-bet" class="upg-input" placeholder="Ставка" value="1000">
            <div class="upg-mults">
                <button class="upg-mult" onclick="playUpgrader(2)">x2 (45%)</button>
                <button class="upg-mult" onclick="playUpgrader(3)">x3 (30%)</button>
                <button class="upg-mult" onclick="playUpgrader(5)">x5 (18%)</button>
            </div>
            <div class="upg-result" id="upg-result"></div>
        </div>
        
        <div class="glass-card" style="text-align: center; opacity: 0.5;">
            <h3 style="margin: 0;">💣 Мины</h3>
            <p style="font-size: 12px; margin-top: 5px;">В разработке</p>
        </div>
    </div>

    <!-- ЭКРАН 4: РАБОТА -->
    <div id="tab-work" class="screen">
        <h2>💼 Работа</h2>
        <div class="glass-card">
            <h3 style="margin: 0 0 5px 0;">🏢 Мои бизнесы</h3>
            <div id="biz-list" class="loader">Загрузка...</div>
        </div>
    </div>

    <!-- ЭКРАН 5: РЕЙТИНГ -->
    <div id="tab-rating" class="screen">
        <h2>🏆 Топ игроков</h2>
        <div class="glass-card" id="rating-list">Загрузка...</div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>Главная</button>
        <button class="nav-item" onclick="switchTab('shop', this)"><span>🛒</span>Магазин</button>
        <button class="nav-item" onclick="switchTab('casino', this)"><span>🎰</span>Казино</button>
        <button class="nav-item" onclick="switchTab('work', this)"><span>💼</span>Работа</button>
        <button class="nav-item" onclick="switchTab('rating', this)"><span>🏆</span>Рейтинг</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#09090b'); 
        tg.setBackgroundColor('#09090b');
        
        // ВСТАВЬ СВОЮ ССЫЛКУ С RENDER!
        const API_URL = "https://my-game-api-jm79.onrender.com"; 
        const userId = tg.initDataUnsafe?.user?.id || 7127705775;
        let currentBalance = 0;

        // Haptic Feedback (вибрация при нажатии)
        function haptic() { if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }

        // Навигация
        function switchTab(tabId, btn) {
            haptic();
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(tabId === 'rating') loadRating();
            if(tabId === 'work') loadBusinesses();
        }

        // Загрузка профиля
        async function loadProfile() {
            try {
                const res = await fetch(`${API_URL}/api/profile/${userId}`);
                const data = await res.json();
                document.getElementById('nickname').innerText = data.nickname;
                document.getElementById('avatar').innerText = data.nickname[0].toUpperCase();
                document.getElementById('rank').innerText = `Место: #${data.rank}`;
                updateBalance(data.balance);
            } catch (e) { tg.showAlert("Ошибка загрузки профиля"); }
        }

        function updateBalance(bal) {
            currentBalance = bal;
            document.getElementById('balance').innerText = bal.toLocaleString('ru-RU') + " 💰";
        }

        // Магазин
        async function loadShop() {
            const res = await fetch(`${API_URL}/api/shop`);
            const data = await res.json();
            const box = document.getElementById('shop-list');
            box.innerHTML = '';
            data.items.forEach(item => {
                box.innerHTML += `
                    <div class="shop-item">
                        <div>
                            <div style="font-size: 18px; font-weight: bold; margin-bottom: 4px;">${item.emoji} ${item.name}</div>
                            <div style="color: var(--accent); font-weight: bold;">${item.price.toLocaleString('ru-RU')} 💰</div>
                        </div>
                        <button class="btn" onclick="buyItem(${item.id})">Купить</button>
                    </div>
                `;
            });
        }

        async function buyItem(id) {
            haptic();
            const res = await fetch(`${API_URL}/api/shop/buy`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tg_id: userId, item_id: id })
            });
            const data = await res.json();
            if (res.ok) { 
                tg.showAlert(`✅ ${data.message}`); 
                updateBalance(data.new_balance); 
            } else { 
                tg.showAlert(`❌ ${data.detail}`); 
            }
        }

        // Казино
        async function playUpgrader(mult) {
            haptic();
            const bet = parseInt(document.getElementById('upg-bet').value);
            if (isNaN(bet) || bet < 100) return tg.showAlert("Мин. ставка 100");
            
            const resBox = document.getElementById('upg-result');
            resBox.innerHTML = "Крутим... 🎲";
            
            const res = await fetch(`${API_URL}/api/casino/upgrader`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tg_id: userId, bet: bet, mult: mult })
            });
            const data = await res.json();
            
            if (res.ok) {
                updateBalance(data.new_balance);
                if (data.result === 'win') {
                    resBox.innerHTML = `<span style="color:#00ffcc; text-shadow: 0 0 10px #00ffcc;">✅ ВЫИГРАЛ! +${(bet*(mult-1)).toLocaleString()} 💰</span>`;
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    resBox.innerHTML = `<span style="color:#ff4444;">❌ Проиграл. Выпало: ${data.roll} (нужно ≤${data.chance})</span>`;
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }
            } else {
                tg.showAlert(data.detail);
                resBox.innerHTML = "";
            }
        }

        // Рейтинг
        async function loadRating() {
            const res = await fetch(`${API_URL}/api/rating`);
            const data = await res.json();
            const box = document.getElementById('rating-list');
            box.innerHTML = '';
            data.top.forEach((u, i) => {
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                box.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:16px;">
                    <span style="font-weight:bold;">${medal} ${u.nickname}</span>
                    <span style="color:var(--accent); font-weight:bold;">${u.balance.toLocaleString('ru-RU')} 💰</span>
                </div>`;
            });
        }

        // Бизнесы
        async function loadBusinesses() {
            const res = await fetch(`${API_URL}/api/businesses/${userId}`);
            const data = await res.json();
            const box = document.getElementById('biz-list');
            if (data.businesses.length === 0) {
                box.innerHTML = `<p style="color:var(--sub); font-size:14px;">У тебя пока нет бизнесов.</p>`;
                return;
            }
            box.innerHTML = '';
            data.businesses.forEach(b => {
                box.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px solid #333; padding-top:10px;">
                        <div>
                            <div style="font-weight:bold;">${b.name} (Ур. ${b.level})</div>
                            <div style="font-size:12px; color:var(--sub);">Доход: ${b.income_per_hour.toLocaleString()} /час</div>
                        </div>
                        <button class="btn" onclick="collectBiz(${b.id})">${b.pending.toLocaleString()} 💰</button>
                    </div>
                `;
            });
        }

        async function collectBiz(id) {
            haptic();
            const res = await fetch(`${API_URL}/api/businesses/collect/${id}`, { method: 'POST' });
            const data = await res.json();
            if(res.ok) {
                updateBalance(data.new_balance);
                loadBusinesses();
                tg.showAlert(`✅ Собрано: ${data.collected.toLocaleString()} 💰`);
            }
        }

        // Дейлики
        async function claimDaily() {
            haptic();
            const res = await fetch(`${API_URL}/api/daily/${userId}`, { method: 'POST' });
            const data = await res.json();
            if (res.ok) {
                updateBalance(data.new_balance);
                tg.showAlert(`🎁 Награда получена!\n+${data.reward.toLocaleString()} 💰\nСерия: ${data.streak} дней`);
            } else {
                tg.showAlert(`❌ ${data.detail}`);
            }
        }

        // Инициализация
        loadProfile();
        loadShop();
    </script>
</body>
    </html>
