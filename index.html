<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #00ffcc; --text: #ffffff; --sub: #aaaaaa; }
        body { margin: 0; padding: 20px 20px 80px 20px; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .screen { width: 100%; max-width: 400px; display: none; }
        .screen.active { display: block; }
        
        /* Стили профиля */
        .profile-card { background: var(--card); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid #333; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(45deg, #00ffcc, #0066ff); display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .balance { font-size: 36px; font-weight: bold; color: var(--accent); margin: 10px 0; }
        
        /* Стили магазина */
        .shop-item { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .shop-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .shop-info p { margin: 0; color: var(--sub); font-size: 14px; }
        .buy-btn { background: var(--accent); color: #000; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .buy-btn:active { transform: scale(0.95); }

        /* Нижняя навигация */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav-btn { background: none; border: none; color: var(--sub); font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-btn.active { color: var(--accent); }
        .nav-btn span { font-size: 24px; }
        
        .loader { border: 4px solid #333; border-top: 4px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="screen-home" class="screen active">
        <div class="profile-card">
            <div class="avatar" id="avatar">?</div>
            <h1 id="nickname">Загрузка...</h1>
            <p style="color: var(--sub); margin: 0;">Игровой профиль</p>
            <div class="balance" id="balance">0 💰</div>
        </div>
    </div>

    <!-- ЭКРАН 2: МАГАЗИН -->
    <div id="screen-shop" class="screen">
        <h2 style="text-align: center;">🛒 Магазин</h2>
        <div id="shop-list">Загрузка товаров...</div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchScreen('home')"><span>🏠</span> Главная</button>
        <button class="nav-btn" onclick="switchScreen('shop')"><span>🛒</span> Магазин</button>
        <button class="nav-btn" onclick="tg.showAlert('Казино скоро!')"><span>🎰</span> Казино</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#121212');

        const API_URL = "https://my-game-api-jm79.onrender.com"; // Твоя ссылка
        const userId = tg.initDataUnsafe?.user?.id || 7127705775;
        let currentBalance = 0;

        // Переключение экранов
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screenId}`).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // Загрузка профиля
        async function loadProfile() {
            try {
                const res = await fetch(`${API_URL}/api/profile/${userId}`);
                const data = await res.json();
                document.getElementById('nickname').innerText = data.nickname;
                document.getElementById('avatar').innerText = data.nickname[0].toUpperCase();
                currentBalance = data.balance;
                updateBalanceUI(data.balance);
            } catch (e) { console.error(e); }
        }

        function updateBalanceUI(bal) {
            document.getElementById('balance').innerText = bal.toLocaleString('ru-RU') + " 💰";
        }

        // Загрузка магазина
        async function loadShop() {
            try {
                const res = await fetch(`${API_URL}/api/shop`);
                const data = await res.json();
                const container = document.getElementById('shop-list');
                container.innerHTML = '';
                
                data.items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'shop-item';
                    div.innerHTML = `
                        <div class="shop-info">
                            <h3>${item.emoji} ${item.name}</h3>
                            <p>Цена: ${item.price.toLocaleString('ru-RU')} 💰</p>
                        </div>
                        <button class="buy-btn" onclick="buyItem(${item.id})">Купить</button>
                    `;
                    container.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        // Покупка
        async function buyItem(itemId) {
            try {
                const res = await fetch(`${API_URL}/api/shop/buy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tg_id: userId, item_id: itemId })
                });
                const data = await res.json();
                
                if (res.ok) {
                    tg.showAlert(`✅ ${data.message}`);
                    currentBalance = data.new_balance;
                    updateBalanceUI(currentBalance);
                } else {
                    tg.showAlert(`❌ ${data.detail}`);
                }
            } catch (e) { tg.showAlert("Ошибка сети"); }
        }

        // Запуск
        loadProfile();
        loadShop();
    </script>
</body>
            </html>
